<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💍 Will You Love Me?</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --pink: #f472b6;
      --deep-pink: #ec4899;
      --rose: #fb7185;
      --lavender: #c4b5fd;
      --purple: #a78bfa;
      --glass: rgba(255,255,255,0.12);
      --glass-border: rgba(255,255,255,0.25);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Lato', sans-serif;
      background: #0d0010;
      color: #fff;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1a0020; }
    ::-webkit-scrollbar-thumb { background: var(--pink); border-radius: 3px; }

    #particle-canvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }

    section { position: relative; z-index: 1; }

    /* ── MUSIC TOGGLE ── */
    .music-btn {
      position: fixed; top: 1.2rem; right: 1.2rem;
      z-index: 9999;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      border-radius: 50%;
      width: 46px; height: 46px;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s;
      color: #fff;
    }
    .music-btn:hover { transform: scale(1.1); box-shadow: 0 0 20px rgba(244,114,182,0.5); }
    .music-btn.playing { animation: spin-slow 4s linear infinite; }

    /* ── PAGE TRANSITIONS ── */
    .page-enter { animation: pageFadeIn 0.8s cubic-bezier(0.23,1,0.32,1) forwards; }
    .page-exit  { animation: pageFadeOut 0.5s ease forwards; }

    @keyframes pageFadeIn {
      from { opacity: 0; transform: scale(0.97) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes pageFadeOut {
      from { opacity: 1; transform: scale(1); }
      to   { opacity: 0; transform: scale(1.03); }
    }

    /* ══════════════════════════════════════════
       PAGE 1 — LANDING
    ══════════════════════════════════════════ */
    .landing {
      height: 100vh;
      overflow: hidden;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
      background: radial-gradient(ellipse at 50% 30%, #4c0080 0%, #1e0030 45%, #0d0010 100%);
    }

    .landing-hearts {
      font-size: 3rem;
      animation: float 3s ease-in-out infinite;
      margin-bottom: 1.2rem;
      display: block;
    }

    .landing h1 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.6rem, 8vw, 5.5rem);
      background: linear-gradient(135deg, #fff 0%, var(--lavender) 40%, var(--pink) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
      margin-bottom: 2.8rem;
      animation: fadeUp 1s 0.3s ease both;
      text-shadow: none;
      filter: drop-shadow(0 0 30px rgba(244,114,182,0.35));
    }

    .landing-buttons {
      display: flex;
      gap: 1.4rem;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeUp 1s 0.7s ease both;
    }

    .btn-yes-main {
      padding: 1rem 2.8rem;
      border-radius: 50px; border: none;
      cursor: pointer; font-size: 1.1rem; font-weight: 700;
      font-family: 'Lato', sans-serif;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      box-shadow: 0 0 30px rgba(34,197,94,0.5);
      transition: transform 0.25s, box-shadow 0.25s;
      letter-spacing: 0.5px;
      animation: pulse-green 2s 1.5s ease infinite;
    }
    .btn-yes-main:hover {
      transform: scale(1.08) translateY(-3px);
      box-shadow: 0 0 55px rgba(34,197,94,0.8);
    }

    .btn-no-main {
      padding: 1rem 2.8rem;
      border-radius: 50px; border: none;
      cursor: pointer; font-size: 1.1rem; font-weight: 700;
      font-family: 'Lato', sans-serif;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #fff;
      box-shadow: 0 0 20px rgba(239,68,68,0.4);
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), left 0.4s cubic-bezier(0.34,1.56,0.64,1), top 0.4s cubic-bezier(0.34,1.56,0.64,1);
      letter-spacing: 0.5px;
      user-select: none;
    }

    .btn-no-main.floating {
      position: fixed;
      z-index: 9990;
    }

    /* ── COURTSHIP SCREEN ── */
    .courtship-screen {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
      background: radial-gradient(ellipse at 50% 40%, #4c0080 0%, #1e0030 50%, #0d0010 100%);
    }

    .courtship-illustration {
      margin-bottom: 1.8rem;
      animation: fadeUp 0.9s 0.1s ease both;
    }

    .courtship-screen h2 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2rem, 6vw, 3.8rem);
      background: linear-gradient(135deg, #fff, var(--lavender), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
      animation: fadeUp 0.9s 0.3s ease both;
    }

    .courtship-screen p {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      color: rgba(255,255,255,0.8);
      max-width: 520px; line-height: 1.7;
      margin-bottom: 2.5rem;
      animation: fadeUp 0.9s 0.5s ease both;
    }

    .btn-view-more {
      padding: 1rem 2.8rem;
      border-radius: 50px; border: none;
      cursor: pointer; font-size: 1.05rem; font-weight: 700;
      font-family: 'Lato', sans-serif;
      background: linear-gradient(135deg, var(--deep-pink), var(--purple));
      color: #fff;
      box-shadow: 0 0 35px rgba(236,72,153,0.55);
      transition: transform 0.25s, box-shadow 0.25s;
      animation: fadeUp 0.9s 0.7s ease both, pulse-glow 2s 1.5s infinite;
      letter-spacing: 0.5px;
    }
    .btn-view-more:hover {
      transform: scale(1.08) translateY(-3px);
      box-shadow: 0 0 60px rgba(236,72,153,0.8);
    }

    /* ── FLOATING HEARTS ── */
    .floating-heart {
      position: fixed;
      pointer-events: none;
      animation: floatUp linear forwards;
      z-index: 400;
    }

    /* ══════════════════════════════════════════
       PAGE 2 — ROMANTIC CONTENT
    ══════════════════════════════════════════ */
    .section-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 5rem 2rem;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 4vw, 3rem);
      text-align: center;
      background: linear-gradient(135deg, #fff, var(--lavender));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.8rem;
    }

    .section-sub {
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-size: 1rem;
      margin-bottom: 3.5rem;
    }

    /* ── page 2 hero banner ── */
    .page2-hero {
      min-height: 60vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 3rem 2rem;
      background: radial-gradient(ellipse at 50% 0%, #3b0764 0%, #1e0030 40%, #0d0010 100%);
    }
    .page2-hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 4rem);
      background: linear-gradient(135deg, #fff, var(--lavender), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      max-width: 700px; line-height: 1.3;
      animation: fadeUp 1s 0.2s ease both;
    }
    .page2-hero p {
      margin-top: 1rem;
      color: rgba(255,255,255,0.65);
      font-size: 1.1rem; max-width: 500px; line-height: 1.7;
      animation: fadeUp 1s 0.5s ease both;
    }

    /* ── TIMELINE ── */
    .timeline-section { background: linear-gradient(180deg, #0d0010 0%, #1a0030 50%, #0d0010 100%); }

    .timeline { position: relative; padding: 1rem 0; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 50%; top: 0; bottom: 0; width: 2px;
      background: linear-gradient(to bottom, transparent, var(--pink), var(--lavender), transparent);
      transform: translateX(-50%);
    }

    .timeline-item {
      display: flex;
      justify-content: flex-end;
      padding-right: calc(50% + 2.5rem);
      margin-bottom: 3rem;
      opacity: 0; transform: translateX(-60px);
      transition: all 0.7s cubic-bezier(0.23,1,0.32,1);
    }
    .timeline-item.right {
      justify-content: flex-start;
      padding-right: 0; padding-left: calc(50% + 2.5rem);
      transform: translateX(60px);
    }
    .timeline-item.visible { opacity: 1; transform: translateX(0); }

    .timeline-dot {
      position: absolute; left: 50%;
      transform: translateX(-50%);
      width: 18px; height: 18px; border-radius: 50%;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      box-shadow: 0 0 15px var(--pink);
      border: 3px solid #0d0010; z-index: 2;
    }

    .timeline-card {
      background: var(--glass);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 1.5rem; max-width: 380px;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .timeline-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(244,114,182,0.2); }
    .timeline-emoji { font-size: 2.2rem; margin-bottom: 0.6rem; }
    .timeline-date { font-size: 0.75rem; color: var(--pink); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.4rem; }
    .timeline-card h3 { font-family: 'Playfair Display', serif; font-size: 1.2rem; margin-bottom: 0.5rem; color: #fff; }
    .timeline-card p { color: rgba(255,255,255,0.65); font-size: 0.9rem; line-height: 1.6; }

    /* ── GALLERY ── */
    .gallery-section { background: linear-gradient(180deg, #0d0010, #200040, #0d0010); }

    .masonry-grid { columns: 3; column-gap: 1rem; }
    @media(max-width: 768px) { .masonry-grid { columns: 2; } }
    @media(max-width: 480px) { .masonry-grid { columns: 1; } }

    .gallery-item {
      break-inside: avoid; margin-bottom: 1rem;
      border-radius: 16px; overflow: hidden;
      cursor: pointer; position: relative;
      background: var(--glass); border: 1px solid var(--glass-border);
    }
    .gallery-placeholder {
      width: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem 1rem; gap: 0.5rem; min-height: 160px;
    }
    .gallery-placeholder-icon { font-size: 2.5rem; }
    .gallery-placeholder-text { font-family: 'Dancing Script', cursive; font-size: 1rem; color: rgba(255,255,255,0.8); text-align: center; }
    .gallery-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 50%);
      opacity: 0; transition: opacity 0.3s;
      display: flex; align-items: flex-end; padding: 1rem;
    }
    .gallery-item:hover .gallery-overlay { opacity: 1; }
    .gallery-item:hover { transform: scale(1.02); transition: transform 0.3s; }
    .gallery-caption { color: #fff; font-family: 'Dancing Script', cursive; font-size: 1rem; }

    .lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
      z-index: 1000; display: flex; align-items: center; justify-content: center;
      animation: fadeIn 0.3s ease;
    }
    .lightbox-content { position: relative; max-width: 90vw; max-height: 90vh; text-align: center; }
    .lightbox-inner {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 24px; padding: 3rem 2rem;
      font-family: 'Dancing Script', cursive; font-size: 1.5rem; color: #fff; max-width: 400px;
    }
    .lightbox-close {
      position: absolute; top: -1rem; right: -1rem;
      background: var(--deep-pink); border: none; border-radius: 50%;
      width: 36px; height: 36px; cursor: pointer; color: #fff; font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── REASONS ── */
    .reasons-section { background: linear-gradient(180deg, #0d0010, #1a0030, #0d0010); }

    .reasons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }

    .reason-card {
      background: var(--glass); backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border); border-radius: 24px;
      padding: 2rem 1.5rem; text-align: center;
      opacity: 0; transform: translateY(40px) scale(0.95);
      transition: all 0.6s cubic-bezier(0.23,1,0.32,1);
    }
    .reason-card.visible { opacity: 1; transform: translateY(0) scale(1); }
    .reason-card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 25px 50px rgba(244,114,182,0.25); border-color: var(--pink); }
    .reason-icon { font-size: 2.8rem; margin-bottom: 1rem; }
    .reason-card h3 { font-family: 'Playfair Display', serif; font-size: 1.15rem; margin-bottom: 0.6rem; color: #fff; }
    .reason-card p { color: rgba(255,255,255,0.6); font-size: 0.88rem; line-height: 1.6; }

    /* ── COUNTER ── */
    .counter-section {
      background: linear-gradient(135deg, #1a0030, #2d0050, #1a0030);
      padding: 5rem 2rem; text-align: center;
    }
    .counter-grid { display: flex; justify-content: center; flex-wrap: wrap; gap: 1.5rem; margin-top: 3rem; }
    .counter-card {
      background: var(--glass); backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border); border-radius: 24px;
      padding: 2rem 2.5rem; min-width: 160px; position: relative; overflow: hidden;
    }
    .counter-card::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(244,114,182,0.1), rgba(167,139,250,0.1));
      pointer-events: none;
    }
    .counter-number {
      font-family: 'Playfair Display', serif; font-size: 3rem; font-weight: 700;
      background: linear-gradient(135deg, var(--pink), var(--lavender));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1;
    }
    .counter-label { margin-top: 0.5rem; color: rgba(255,255,255,0.6); font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; }

    /* ── DREAMS ── */
    .dreams-section { background: linear-gradient(180deg, #0d0010, #200040, #0d0010); }
    .dreams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; }
    .dream-card {
      background: var(--glass); backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border); border-radius: 24px;
      padding: 2.5rem 1.5rem; text-align: center;
      opacity: 0; transform: translateY(40px);
      transition: all 0.7s cubic-bezier(0.23,1,0.32,1); position: relative; overflow: hidden;
    }
    .dream-card::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(244,114,182,0.05), rgba(167,139,250,0.05));
      opacity: 0; transition: opacity 0.3s;
    }
    .dream-card:hover::before { opacity: 1; }
    .dream-card.visible { opacity: 1; transform: translateY(0); }
    .dream-card:hover { transform: translateY(-8px); box-shadow: 0 30px 60px rgba(244,114,182,0.2); }
    .dream-illustration { font-size: 4rem; margin-bottom: 1rem; animation: float 3s ease-in-out infinite; }
    .dream-card h3 { font-family: 'Playfair Display', serif; font-size: 1.2rem; margin-bottom: 0.6rem; color: #fff; }
    .dream-card p { color: rgba(255,255,255,0.6); font-size: 0.88rem; line-height: 1.6; }

    /* ── LETTER ── */
    .letter-section { background: linear-gradient(180deg, #0d0010, #1a0030); padding: 5rem 2rem; }
    .letter-wrapper { max-width: 700px; margin: 0 auto; }
    .letter-paper {
      background: rgba(255,241,242,0.05); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,200,200,0.2); border-radius: 24px; padding: 3rem 3.5rem; position: relative;
    }
    .letter-paper::before {
      content: '"'; position: absolute; top: 1rem; left: 2rem;
      font-size: 8rem; color: rgba(244,114,182,0.1);
      font-family: 'Playfair Display', serif; line-height: 1;
    }
    .letter-paper p {
      font-family: 'Dancing Script', cursive; font-size: 1.4rem;
      line-height: 2; color: rgba(255,255,255,0.9); position: relative; z-index: 1; min-height: 200px;
    }
    .cursor-blink {
      display: inline-block; width: 2px; height: 1.2em;
      background: var(--pink); margin-left: 2px; vertical-align: text-bottom;
      animation: blink 0.8s ease infinite;
    }
    .letter-signature { font-family: 'Dancing Script', cursive; font-size: 1.6rem; color: var(--pink); text-align: right; margin-top: 1.5rem; }

    /* ── PROPOSAL ── */
    .proposal-section {
      background: radial-gradient(ellipse at 50% 50%, #3b0764 0%, #1e0030 50%, #0d0010 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 5rem 2rem; text-align: center;
    }
    .proposal-inner { max-width: 600px; margin: 0 auto; }
    .ring-animation { font-size: 5rem; animation: ringPulse 1.5s ease-in-out infinite; display: block; margin-bottom: 1.5rem; }
    .proposal-inner h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      background: linear-gradient(135deg, #fff, var(--lavender), var(--pink));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 1rem;
    }
    .proposal-inner p { color: rgba(255,255,255,0.7); font-size: 1.1rem; line-height: 1.7; margin-bottom: 2.5rem; }
    .proposal-buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn-yes-proposal {
      padding: 1rem 3rem; border-radius: 50px; border: none; cursor: pointer;
      font-size: 1.1rem; font-weight: 700;
      background: linear-gradient(135deg, #ec4899, #a855f7); color: #fff;
      box-shadow: 0 0 40px rgba(236,72,153,0.6);
      transition: all 0.3s; animation: pulse-glow 2s ease infinite;
    }
    .btn-yes-proposal:hover { transform: scale(1.1); box-shadow: 0 0 70px rgba(236,72,153,0.9); }
    .btn-no-proposal {
      padding: 1rem 3rem; border-radius: 50px; border: 2px solid rgba(255,255,255,0.3);
      cursor: pointer; font-size: 1rem; background: transparent; color: rgba(255,255,255,0.6);
      transition: all 0.3s;
    }
    .btn-no-proposal:hover { border-color: var(--pink); color: var(--pink); }

    /* ── YES FINAL SCREEN ── */
    .yes-final-screen {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 50% 50%, #4c0080 0%, #1a0030 60%, #0d0010 100%);
      z-index: 500;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
      animation: fadeIn 0.8s ease;
    }
    .yes-emoji { font-size: 6rem; animation: bounce 0.6s ease infinite alternate; }
    .yes-final-screen h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 6vw, 5rem);
      background: linear-gradient(135deg, #fff, var(--pink), var(--lavender));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin: 1rem 0;
    }
    .yes-final-screen p {
      font-family: 'Dancing Script', cursive; font-size: 1.6rem;
      color: rgba(255,255,255,0.8); max-width: 500px; line-height: 1.6;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 30px rgba(236,72,153,0.5); }
      50%       { box-shadow: 0 0 60px rgba(236,72,153,0.8), 0 0 100px rgba(167,139,250,0.4); }
    }
    @keyframes pulse-green {
      0%, 100% { box-shadow: 0 0 30px rgba(34,197,94,0.5); }
      50%       { box-shadow: 0 0 60px rgba(34,197,94,0.85); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; } 50% { opacity: 0; }
    }
    @keyframes ringPulse {
      0%, 100% { transform: scale(1) rotate(-5deg); }
      50%       { transform: scale(1.15) rotate(5deg); }
    }
    @keyframes bounce {
      from { transform: translateY(0) scale(1); }
      to   { transform: translateY(-20px) scale(1.1); }
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0.9; }
      100% { transform: translateY(-100vh) rotate(30deg); opacity: 0; }
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

  <canvas id="particle-canvas"></canvas>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    /* ══════════════════════════════════════════
       PARTICLE CANVAS
    ══════════════════════════════════════════ */
    function initParticles() {
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      let W, H;

      const resize = () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; };
      resize();
      window.addEventListener('resize', resize);

      const HEARTS = ['❤', '💕', '✨', '⭐', '💫', '🌸'];

      class Particle {
        constructor() { this.reset(true); }
        reset(init = false) {
          this.x = Math.random() * W;
          this.y = init ? Math.random() * H : H + 20;
          this.size = Math.random() * 16 + 8;
          this.speedY = Math.random() * 0.6 + 0.2;
          this.speedX = (Math.random() - 0.5) * 0.4;
          this.opacity = Math.random() * 0.45 + 0.08;
          this.char = HEARTS[Math.floor(Math.random() * HEARTS.length)];
          this.rotation = Math.random() * Math.PI * 2;
          this.rotSpeed = (Math.random() - 0.5) * 0.02;
        }
        update() {
          this.y -= this.speedY; this.x += this.speedX; this.rotation += this.rotSpeed;
          if (this.y < -30) this.reset();
        }
        draw() {
          ctx.save(); ctx.globalAlpha = this.opacity;
          ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
          ctx.font = `${this.size}px serif`; ctx.textAlign = 'center';
          ctx.fillText(this.char, 0, 0); ctx.restore();
        }
      }

      for (let i = 0; i < 50; i++) particles.push(new Particle());
      const animate = () => { ctx.clearRect(0, 0, W, H); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); };
      animate();
    }

    /* ══════════════════════════════════════════
       SCROLL OBSERVER HOOK
    ══════════════════════════════════════════ */
    function useScrollObserver(threshold = 0.15) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVisible(true); obs.disconnect(); } }, { threshold });
        if (ref.current) obs.observe(ref.current);
        return () => obs.disconnect();
      }, []);
      return [ref, visible];
    }

    /* ══════════════════════════════════════════
       FLOATING HEARTS BURST
    ══════════════════════════════════════════ */
    function spawnHearts(count = 20) {
      const emojis = ['💕', '❤️', '💍', '✨', '🌹', '💗', '🌸', '💖'];
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const el = document.createElement('div');
          el.className = 'floating-heart';
          el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          el.style.left = Math.random() * 100 + 'vw';
          el.style.bottom = '0';
          el.style.fontSize = (Math.random() * 22 + 14) + 'px';
          el.style.animationDuration = (Math.random() * 3 + 3) + 's';
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 6500);
        }, i * 120);
      }
    }

    /* ══════════════════════════════════════════
       MUSIC TOGGLE
    ══════════════════════════════════════════ */
    function MusicToggle() {
      const [playing, setPlaying] = useState(false);
      const audioRef = useRef(null);

      useEffect(() => {
        // Using a free royalty-free romantic tune via Web Audio API oscillator as fallback
        // since we can't rely on external audio files
        audioRef.current = null;
      }, []);

      const toggle = () => {
        if (!audioRef.current) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
          let time = ctx.currentTime;

          const playMelody = () => {
            notes.forEach((freq, i) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.connect(gain); gain.connect(ctx.destination);
              osc.frequency.value = freq;
              osc.type = 'sine';
              gain.gain.setValueAtTime(0, time + i * 0.4);
              gain.gain.linearRampToValueAtTime(0.08, time + i * 0.4 + 0.05);
              gain.gain.linearRampToValueAtTime(0, time + i * 0.4 + 0.35);
              osc.start(time + i * 0.4);
              osc.stop(time + i * 0.4 + 0.4);
            });
            time += notes.length * 0.4;
          };

          playMelody();
          const id = setInterval(playMelody, notes.length * 400 + 200);
          audioRef.current = { stop: () => clearInterval(id) };
          setPlaying(true);
        } else {
          audioRef.current.stop();
          audioRef.current = null;
          setPlaying(false);
        }
      };

      return (
        <button className={`music-btn ${playing ? 'playing' : ''}`} onClick={toggle} title={playing ? 'Pause music' : 'Play music'}>
          {playing ? '🎵' : '🎶'}
        </button>
      );
    }

        <section className="reasons-section" id="reasons">
          <div className="section-inner">
            <h2 className="section-title">Why I Love You 💝</h2>
            <p className="section-sub">Let me count the ways...</p>
            <div className="reasons-grid">
              {reasons.map((r, i) => <ReasonCard key={i} data={r} index={i} />)}
            </div>
          </div>
        </section>
      );
    }

    /* ══════════════════════════════════════════
       COUNTER
    ══════════════════════════════════════════ */
    function Counter() {
      const [counts, setCounts] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });

      useEffect(() => {
        const START = new Date('2024-10-29T00:00:00Z').getTime();
        const tick = () => {
          const totalSeconds = Math.floor((Date.now() - START) / 1000);
          setCounts({
            days: Math.floor(totalSeconds / 86400),
            hours: Math.floor((totalSeconds % 86400) / 3600),
            minutes: Math.floor((totalSeconds % 3600) / 60),
            seconds: totalSeconds % 60,
          });
        };
        tick();
        const id = setInterval(tick, 1000);
        return () => clearInterval(id);
      }, []);

      return (
        <section className="counter-section" id="counter">
          <h2 className="section-title">Time Together ⏳</h2>
          <p className="section-sub">Every second with you is a treasure</p>
          <div className="counter-grid">
            {[['DAYS', counts.days], ['HOURS', counts.hours], ['MINUTES', counts.minutes], ['SECONDS', counts.seconds]].map(([label, value]) => (
              <div key={label} className="counter-card">
                <div className="counter-number">{String(value).padStart(2, '0')}</div>
                <div className="counter-label">{label}</div>
              </div>
            ))}
          </div>
        </section>
      );
    }

    /* ══════════════════════════════════════════
       DREAMS
    ══════════════════════════════════════════ */
    const dreams = [
      { icon: '✈️', title: 'Travel The World', text: "Every corner of this world is a new adventure waiting for us. Let's collect memories, not things." },
      { icon: '🏡', title: 'Build Our Home', text: "A place that's ours — filled with laughter, love, and the warmth only we can create together." },
      { icon: '🌠', title: 'Chase Our Dreams', text: "Your dreams are my dreams. Together, there's nothing we can't achieve." },
      { icon: '👴👵', title: 'Grow Old Together', text: 'I want to hold your hand through every season of life and still look at you like it\'s the first time.' },
    ];

    function DreamCard({ data, index }) {
      const [ref, visible] = useScrollObserver(0.1);
      return (
        <div ref={ref} className={`dream-card ${visible ? 'visible' : ''}`} style={{ transitionDelay: `${index * 0.15}s` }}>
          <div className="dream-illustration">{data.icon}</div>
          <h3>{data.title}</h3>
          <p>{data.text}</p>
        </div>
      );
    }

    function Dreams() {
      return (
        <section className="dreams-section" id="dreams">
          <div className="section-inner">
            <h2 className="section-title">Our Future Dreams 🔮</h2>
            <p className="section-sub">A lifetime of adventures awaits us</p>
            <div className="dreams-grid">
              {dreams.map((d, i) => <DreamCard key={i} data={d} index={i} />)}
            </div>
          </div>
        </section>
      );
    }

    /* ══════════════════════════════════════════
       LOVE LETTER
    ══════════════════════════════════════════ */
    const LETTER_TEXT = `From the day you entered my life, everything became brighter. You have brought happiness, support, laughter, and meaning to my journey. Every moment with you is a memory I cherish. Today, I want to ask you something that comes straight from my heart...`;

    function Letter() {
      const [ref, visible] = useScrollObserver(0.2);
      const [displayed, setDisplayed] = useState('');
      const [typing, setTyping] = useState(false);
      const indexRef = useRef(0);

      useEffect(() => {
        if (!visible || typing) return;
        setTyping(true);
        const type = () => {
          if (indexRef.current < LETTER_TEXT.length) {
            setDisplayed(LETTER_TEXT.slice(0, indexRef.current + 1));
            indexRef.current++;
            setTimeout(type, 40);
          }
        };
        setTimeout(type, 500);
      }, [visible]);

      return (
        <section className="letter-section" id="letter">
          <div className="letter-wrapper">
            <h2 className="section-title">A Letter For You 💌</h2>
            <p className="section-sub" style={{ marginBottom: '2rem' }}>Written from the deepest part of my heart</p>
            <div ref={ref} className="letter-paper">
              <p>
                {displayed}
                {indexRef.current < LETTER_TEXT.length && <span className="cursor-blink"></span>}
              </p>
              {indexRef.current >= LETTER_TEXT.length && (
                <div className="letter-signature">— With all my love 💕</div>
              )}
            </div>
          </div>
        </section>
      );
    }

    /* ══════════════════════════════════════════
       PROPOSAL (end of Page 2)
    ══════════════════════════════════════════ */
    function Proposal({ onYes }) {
      const handleYes = async () => {
        spawnHearts(30);
        try {
          await fetch('/api/proposal-response', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ answer: 'yes' }),
          });
        } catch (e) {}
        onYes();
      };

      const handleNo = (e) => {
        const btn = e.currentTarget;
        const maxX = window.innerWidth - (btn.offsetWidth || 120) - 40;
        const maxY = window.innerHeight - (btn.offsetHeight || 50) - 40;
        btn.style.position = 'fixed';
        btn.style.left = (20 + Math.random() * maxX) + 'px';
        btn.style.top = (20 + Math.random() * maxY) + 'px';
        btn.style.zIndex = '999';
        btn.style.transition = 'left 0.4s cubic-bezier(0.34,1.56,0.64,1), top 0.4s cubic-bezier(0.34,1.56,0.64,1)';
        btn.textContent = ['Nope 😅', 'Try again! 😂', 'Are you sure? 🤔', 'Think again! 💭'][Math.floor(Math.random() * 4)];
      };

      return (
        <section className="proposal-section" id="proposal">
          <div className="proposal-inner">
            <span className="ring-animation">💍</span>
            <h2>Will You Be My Forever?</h2>
            <p>
              You are my best friend, my greatest adventure, and the love of my life.
              I can't imagine a single day without you. I want to build a forever with you.
              Will you make me the happiest person in the world?
            </p>
            <div className="proposal-buttons">
              <button className="btn-yes-proposal" onClick={handleYes}>💍 Yes, Forever! 💍</button>
              <button className="btn-no-proposal" onMouseEnter={handleNo} onTouchStart={handleNo}>No 😢</button>
            </div>
          </div>
        </section>
      );
    }

    /* ══════════════════════════════════════════
       YES FINAL SCREEN
    ══════════════════════════════════════════ */
    function YesFinalScreen() {
      useEffect(() => {
        const id = setInterval(() => spawnHearts(15), 2500);
        spawnHearts(30);
        return () => clearInterval(id);
      }, []);

      return (
        <div className="yes-final-screen">
          <span className="yes-emoji">💍</span>
          <h1>She Said YES! 🎉</h1>
          <p>
            This is the happiest moment of my life. You have made me the luckiest person in the
            entire universe. I promise to love you, cherish you, and stand by you — every single
            day, forever and always. 💕
          </p>
        </div>
      );
    }

    /* ══════════════════════════════════════════
       PAGE 2 — Full romantic content
    ══════════════════════════════════════════ */
    function Page2({ startDate }) {
      const [proposalYes, setProposalYes] = useState(false);

      if (proposalYes) return <YesFinalScreen />;

      return (
        <div className="page-enter">
          <div className="page2-hero">
            <h1>Our Beautiful Love Story ❤️</h1>
            <p>Every chapter of us, written in the stars — scroll down to explore our world.</p>
          </div>
          <Timeline />
          <Gallery />
          <Reasons />
          <Counter />
          <Dreams />
          <Letter />
          <Proposal onYes={() => setProposalYes(true)} />
        </div>
      );
    }

    /* ══════════════════════════════════════════
       APP ROOT
    ══════════════════════════════════════════ */
    function App() {
      // screen: 'landing' | 'courtship' | 'page2'
      const [screen, setScreen] = useState('landing');
      const [startDate, setStartDate] = useState('2024-10-29T00:00:00Z');

      useEffect(() => {
        initParticles();
        fetch('/api/relationship')
          .then(r => r.json())
          .then(d => setStartDate(d.startDate))
          .catch(() => {});
      }, []);

      return (
        <>
          <MusicToggle />
          {screen === 'landing' && <LandingPage onYes={() => setScreen('courtship')} />}
          {screen === 'courtship' && <CourtshipScreen onViewMore={() => setScreen('page2')} />}
          {screen === 'page2' && <Page2 startDate={startDate} />}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
